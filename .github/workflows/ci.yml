name: CI
on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: sleep 20 && echo "lint ok"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sleep 30
      - name: Build
        run: sleep 45
      - name: Run tests
        run: |
          sleep 60
          if [ -f should-fail ]; then echo "1 test failed"; exit 1; fi
      - name: Upload coverage
        run: sleep 10

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: sleep 40
